<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    
    <filter id="neon">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="cardShad">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#ff006e" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <rect width="500" height="500" fill="url(#bgGrad3)"/>
  
  <!-- Neon grid pattern -->
  <g opacity="0.1" stroke="#00d9ff" stroke-width="1">
    <line x1="0" y1="100" x2="500" y2="100"/>
    <line x1="0" y1="200" x2="500" y2="200"/>
    <line x1="0" y1="300" x2="500" y2="300"/>
    <line x1="0" y1="400" x2="500" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
  </g>
  
  <!-- Back cards -->
  <g transform="translate(280, 280) rotate(10)" filter="url(#cardShad)">
    <rect x="-75" y="-95" width="150" height="190" rx="8" fill="#0f0f1e" stroke="#ff006e" stroke-width="3"/>
  </g>
  
  <g transform="translate(250, 275) rotate(3)" filter="url(#cardShad)">
    <rect x="-75" y="-95" width="150" height="190" rx="8" fill="#0f0f1e" stroke="#00d9ff" stroke-width="3"/>
  </g>
  
  <!-- Front card -->
  <g transform="translate(220, 270) rotate(-5)" filter="url(#cardShad)">
    <rect x="-75" y="-95" width="150" height="190" rx="8" fill="#1a1a2e" stroke="#ff006e" stroke-width="4"/>
    <rect x="-72" y="-92" width="144" height="28" rx="5" fill="#ff006e"/>
    
    <text x="-54" y="-69" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">B</text>
    <text x="-27" y="-69" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">I</text>
    <text x="0" y="-69" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">N</text>
    <text x="27" y="-69" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">G</text>
    <text x="54" y="-69" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">O</text>
    
    <!-- Numbers with neon glow -->
    <circle cx="-54" cy="-40" r="10" fill="#ff006e" filter="url(#neon)"/>
    <text x="-54" y="-36" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
    
    <circle cx="-27" cy="-40" r="10" fill="#00d9ff" filter="url(#neon)"/>
    <text x="-27" y="-36" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">22</text>
    
    <circle cx="0" cy="-40" r="10" fill="#00ff41" filter="url(#neon)"/>
    <text x="0" y="-36" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">38</text>
    
    <circle cx="27" cy="-40" r="10" fill="#ff006e" filter="url(#neon)"/>
    <text x="27" y="-36" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">54</text>
    
    <circle cx="54" cy="-40" r="10" fill="#00d9ff" filter="url(#neon)"/>
    <text x="54" y="-36" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">71</text>
    
    <!-- Row 2 -->
    <circle cx="-54" cy="-15" r="10" fill="#ff006e" filter="url(#neon)"/>
    <text x="-54" y="-11" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">12</text>
    
    <circle cx="-27" cy="-15" r="10" fill="#00d9ff" filter="url(#neon)"/>
    <text x="-27" y="-11" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">19</text>
    
    <circle cx="0" cy="-15" r="10" fill="#00ff41" filter="url(#neon)"/>
    <text x="0" y="-11" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">44</text>
    
    <circle cx="27" cy="-15" r="10" fill="#ff006e" filter="url(#neon)"/>
    <text x="27" y="-11" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">60</text>
    
    <circle cx="54" cy="-15" r="10" fill="#00d9ff" filter="url(#neon)"/>
    <text x="54" y="-11" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">65</text>
    
    <!-- Row 3 with FREE -->
    <circle cx="-54" cy="10" r="10" fill="#ff006e" filter="url(#neon)"/>
    <text x="-54" y="14" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    
    <circle cx="-27" cy="10" r="10" fill="#00d9ff" filter="url(#neon)"/>
    <text x="-27" y="14" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">28</text>
    
    <circle cx="0" cy="10" r="12" fill="#ffd700" filter="url(#neon)"/>
    <text x="0" y="8" font-size="6" font-weight="bold" fill="#000000" text-anchor="middle">FREE</text>
    <text x="0" y="16" font-size="8" font-weight="bold" fill="#000000" text-anchor="middle">★</text>
    
    <circle cx="27" cy="10" r="10" fill="#ff006e" filter="url(#neon)"/>
    <text x="27" y="14" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">47</text>
    
    <circle cx="54" cy="10" r="10" fill="#00d9ff" filter="url(#neon)"/>
    <text x="54" y="14" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">75</text>
    
    <!-- Row 4 -->
    <circle cx="-54" cy="35" r="10" fill="#ff006e" filter="url(#neon)"/>
    <text x="-54" y="39" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">15</text>
    
    <circle cx="-27" cy="35" r="10" fill="#00d9ff" filter="url(#neon)"/>
    <text x="-27" y="39" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">24</text>
    
    <circle cx="0" cy="35" r="10" fill="#00ff41" filter="url(#neon)"/>
    <text x="0" y="39" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">31</text>
    
    <circle cx="27" cy="35" r="10" fill="#ff006e" filter="url(#neon)"/>
    <text x="27" y="39" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">59</text>
    
    <circle cx="54" cy="35" r="10" fill="#00d9ff" filter="url(#neon)"/>
    <text x="54" y="39" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">68</text>
    
    <!-- Row 5 -->
    <circle cx="-54" cy="60" r="10" fill="#ff006e" filter="url(#neon)"/>
    <text x="-54" y="64" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">9</text>
    
    <circle cx="-27" cy="60" r="10" fill="#00d9ff" filter="url(#neon)"/>
    <text x="-27" y="64" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">16</text>
    
    <circle cx="0" cy="60" r="10" fill="#00ff41" filter="url(#neon)"/>
    <text x="0" y="64" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">42</text>
    
    <circle cx="27" cy="60" r="10" fill="#ff006e" filter="url(#neon)"/>
    <text x="27" y="64" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">52</text>
    
    <circle cx="54" cy="60" r="10" fill="#00d9ff" filter="url(#neon)"/>
    <text x="54" y="64" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">70</text>
  </g>
  
  <text x="250" y="75" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#ff006e" text-anchor="middle" filter="url(#neon)">BINGO</text>
  <text x="250" y="460" font-family="Arial, sans-serif" font-size="68" font-weight="bold" fill="#00d9ff" text-anchor="middle" filter="url(#neon)">75</text>
</svg>