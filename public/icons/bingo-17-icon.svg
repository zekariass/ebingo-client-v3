<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c62828;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d84315;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="cardGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fffde7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fff9c4;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow2">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGradient2)"/>
  
  <!-- Decorative pattern -->
  <circle cx="100" cy="100" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="400" cy="125" r="50" fill="#ffffff" opacity="0.08"/>
  <circle cx="125" cy="400" r="55" fill="#ffffff" opacity="0.08"/>
  <circle cx="425" cy="375" r="45" fill="#ffffff" opacity="0.08"/>
  
  <!-- Floating bingo balls decoration -->
  <g opacity="0.2">
    <circle cx="65" cy="250" r="25" fill="#ffd54f" stroke="#ffffff" stroke-width="2"/>
    <text x="65" y="260" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">B7</text>
  </g>
  
  <g opacity="0.2">
    <circle cx="435" cy="310" r="25" fill="#64b5f6" stroke="#ffffff" stroke-width="2"/>
    <text x="435" y="320" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">I22</text>
  </g>
  
  <!-- Back card (rightmost) -->
  <g transform="translate(290, 255) rotate(12)" filter="url(#shadow2)">
    <rect x="-75" y="-95" width="150" height="190" rx="10" fill="#81c784" stroke="#388e3c" stroke-width="3"/>
    <rect x="-70" y="-90" width="140" height="30" rx="5" fill="#388e3c"/>
    <text x="0" y="-66" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">BINGO</text>
  </g>
  
  <!-- Middle card -->
  <g transform="translate(250, 260) rotate(4)" filter="url(#shadow2)">
    <rect x="-75" y="-95" width="150" height="190" rx="10" fill="#ffb74d" stroke="#f57c00" stroke-width="3"/>
    <rect x="-70" y="-90" width="140" height="30" rx="5" fill="#f57c00"/>
    <text x="0" y="-66" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">BINGO</text>
  </g>
  
  <!-- Front card (leftmost, main focus) -->
  <g transform="translate(210, 265) rotate(-5)" filter="url(#shadow2)">
    <!-- Card background -->
    <rect x="-75" y="-95" width="150" height="190" rx="10" fill="url(#cardGradient2)" stroke="#1565c0" stroke-width="4"/>
    
    <!-- BINGO header bar -->
    <rect x="-70" y="-90" width="140" height="30" rx="5" fill="#1565c0"/>
    
    <!-- BINGO letters in header -->
    <text x="-50" y="-66" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffd54f">B</text>
    <text x="-25" y="-66" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffd54f">I</text>
    <text x="0" y="-66" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffd54f">N</text>
    <text x="25" y="-66" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffd54f">G</text>
    <text x="50" y="-66" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffd54f">O</text>
    
    <!-- Grid lines -->
    <line x1="-70" y1="-55" x2="70" y2="-55" stroke="#bdbdbd" stroke-width="1"/>
    
    <!-- Bingo numbers - Row 1 -->
    <rect x="-65" y="-50" width="24" height="24" rx="3" fill="#ef5350"/>
    <text x="-53" y="-31" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    
    <rect x="-35" y="-50" width="24" height="24" rx="3" fill="#42a5f5"/>
    <text x="-23" y="-31" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">18</text>
    
    <rect x="-5" y="-50" width="24" height="24" rx="3" fill="#66bb6a"/>
    <text x="7" y="-31" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">35</text>
    
    <rect x="25" y="-50" width="24" height="24" rx="3" fill="#ffa726"/>
    <text x="37" y="-31" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">51</text>
    
    <rect x="55" y="-50" width="24" height="24" rx="3" fill="#ab47bc"/>
    <text x="67" y="-31" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">63</text>
    
    <!-- Row 2 -->
    <rect x="-65" y="-20" width="24" height="24" rx="3" fill="#ef5350"/>
    <text x="-53" y="-1" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">11</text>
    
    <rect x="-35" y="-20" width="24" height="24" rx="3" fill="#42a5f5"/>
    <text x="-23" y="-1" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">27</text>
    
    <rect x="-5" y="-20" width="24" height="24" rx="3" fill="#66bb6a"/>
    <text x="7" y="-1" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">41</text>
    
    <rect x="25" y="-20" width="24" height="24" rx="3" fill="#ffa726"/>
    <text x="37" y="-1" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">58</text>
    
    <rect x="55" y="-20" width="24" height="24" rx="3" fill="#ab47bc"/>
    <text x="67" y="-1" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">72</text>
    
    <!-- Row 3 with FREE -->
    <rect x="-65" y="10" width="24" height="24" rx="3" fill="#ef5350"/>
    <text x="-53" y="29" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
    
    <rect x="-35" y="10" width="24" height="24" rx="3" fill="#42a5f5"/>
    <text x="-23" y="29" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">21</text>
    
    <!-- FREE space with star pattern -->
    <rect x="-5" y="10" width="24" height="24" rx="3" fill="#ffd54f" stroke="#f9a825" stroke-width="2"/>
    <text x="7" y="21" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#d84315" text-anchor="middle">FREE</text>
    <text x="7" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d84315" text-anchor="middle">★</text>
    
    <rect x="25" y="10" width="24" height="24" rx="3" fill="#ffa726"/>
    <text x="37" y="29" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">49</text>
    
    <rect x="55" y="10" width="24" height="24" rx="3" fill="#ab47bc"/>
    <text x="67" y="29" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">67</text>
    
    <!-- Row 4 -->
    <rect x="-65" y="40" width="24" height="24" rx="3" fill="#ef5350"/>
    <text x="-53" y="59" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">13</text>
    
    <rect x="-35" y="40" width="24" height="24" rx="3" fill="#42a5f5"/>
    <text x="-23" y="59" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">29</text>
    
    <rect x="-5" y="40" width="24" height="24" rx="3" fill="#66bb6a"/>
    <text x="7" y="59" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">32</text>
    
    <rect x="25" y="40" width="24" height="24" rx="3" fill="#ffa726"/>
    <text x="37" y="59" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">55</text>
    
    <rect x="55" y="40" width="24" height="24" rx="3" fill="#ab47bc"/>
    <text x="67" y="59" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">74</text>
    
    <!-- Row 5 -->
    <rect x="-65" y="70" width="24" height="24" rx="3" fill="#ef5350"/>
    <text x="-53" y="89" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    
    <rect x="-35" y="70" width="24" height="24" rx="3" fill="#42a5f5"/>
    <text x="-23" y="89" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">25</text>
    
    <rect x="-5" y="70" width="24" height="24" rx="3" fill="#66bb6a"/>
    <text x="7" y="89" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">43</text>
    
    <rect x="25" y="70" width="24" height="24" rx="3" fill="#ffa726"/>
    <text x="37" y="89" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">60</text>
    
    <rect x="55" y="70" width="24" height="24" rx="3" fill="#ab47bc"/>
    <text x="67" y="89" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">75</text>
  </g>
  
  <!-- Title with glow effect -->
  <text x="250" y="85" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#ffd54f" text-anchor="middle" filter="url(#glow)">BINGO</text>
  
  <!-- 75 at bottom -->
  <text x="250" y="460" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#glow)">75</text>
</svg>