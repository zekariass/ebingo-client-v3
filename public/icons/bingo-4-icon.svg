<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="vintageBg">
      <stop offset="0%" style="stop-color:#8b0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a0000;stop-opacity:1" />
    </radialGradient>
    
    <pattern id="diamonds" patternUnits="userSpaceOnUse" width="40" height="40">
      <path d="M 20 0 L 40 20 L 20 40 L 0 20 Z" fill="#ffffff" opacity="0.05"/>
    </pattern>
    
    <filter id="vintage">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <rect width="500" height="500" fill="url(#vintageBg)"/>
  <rect width="500" height="500" fill="url(#diamonds)"/>
  
  <!-- Ornamental corners -->
  <circle cx="50" cy="50" r="20" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.6"/>
  <circle cx="450" cy="50" r="20" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.6"/>
  <circle cx="50" cy="450" r="20" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.6"/>
  <circle cx="450" cy="450" r="20" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.6"/>
  
  <!-- Cards -->
