<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d47a1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1976d2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42a5f5;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="spotlight">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
    
    <filter id="cardShadow3">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.5"/>
    </filter>
    
    <filter id="textShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGradient3)"/>
  
  <!-- Spotlight effect -->
  <circle cx="250" cy="250" r="300" fill="url(#spotlight)"/>
  
  <!-- Decorative confetti -->
  <g opacity="0.3">
    <rect x="75" y="100" width="10" height="10" fill="#ffd54f" transform="rotate(45 80 105)"/>
    <rect x="410" y="150" width="12" height="12" fill="#ff4081" transform="rotate(30 416 156)"/>
    <rect x="110" y="375" width="9" height="9" fill="#69f0ae" transform="rotate(60 114.5 379.5)"/>
    <rect x="400" y="350" width="11" height="11" fill="#ffd54f" transform="rotate(15 405.5 355.5)"/>
    <circle cx="440" cy="110" r="5" fill="#ffffff"/>
    <circle cx="85" cy="425" r="6" fill="#ffffff"/>
    <circle cx="425" cy="440" r="4" fill="#69f0ae"/>
  </g>
  
  <!-- Fourth card (back-most) -->
  <g transform="translate(270, 295) rotate(15)" filter="url(#cardShadow3)">
    <rect x="-70" y="-90" width="140" height="180" rx="12" fill="#7e57c2" stroke="#5e35b1" stroke-width="2"/>
  </g>
  
  <!-- Third card -->
  <g transform="translate(258, 288) rotate(8)" filter="url(#cardShadow3)">
    <rect x="-70" y="-90" width="140" height="180" rx="12" fill="#26c6da" stroke="#0097a7" stroke-width="2"/>
  </g>
  
  <!-- Second card -->
  <g transform="translate(246, 282) rotate(2)" filter="url(#cardShadow3)">
    <rect x="-70" y="-90" width="140" height="180" rx="12" fill="#ff7043" stroke="#e64a19" stroke-width="2"/>
  </g>
  
  <!-- Front card (main focus) -->
  <g transform="translate(234, 276) rotate(-4)" filter="url(#cardShadow3)">
    <!-- Card background -->
    <rect x="-70" y="-90" width="140" height="180" rx="12" fill="#ffffff" stroke="#000000" stroke-width="3"/>
    
    <!-- Header gradient bar -->
    <defs>
      <linearGradient id="headerBar" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#ef5350;stop-opacity:1" />
        <stop offset="20%" style="stop-color:#42a5f5;stop-opacity:1" />
        <stop offset="40%" style="stop-color:#66bb6a;stop-opacity:1" />
        <stop offset="60%" style="stop-color:#ffa726;stop-opacity:1" />
        <stop offset="80%" style="stop-color:#ab47bc;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#ef5350;stop-opacity:1" />
      </linearGradient>
    </defs>
    
    <rect x="-68" y="-88" width="136" height="26" rx="8" fill="url(#headerBar)"/>
    
    <!-- BINGO letters -->
    <text x="-50" y="-67" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">B</text>
    <text x="-25" y="-67" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">I</text>
    <text x="0" y="-67" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">N</text>
    <text x="25" y="-67" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">G</text>
    <text x="50" y="-67" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">O</text>
    
    <!-- Compact grid - Row 1 -->
    <circle cx="-50" cy="-40" r="10" fill="#ef5350" stroke="#c62828" stroke-width="1.5"/>
    <text x="-50" y="-36" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
    
    <circle cx="-25" cy="-40" r="10" fill="#42a5f5" stroke="#1976d2" stroke-width="1.5"/>
    <text x="-25" y="-36" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">20</text>
    
    <circle cx="0" cy="-40" r="10" fill="#66bb6a" stroke="#388e3c" stroke-width="1.5"/>
    <text x="0" y="-36" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">33</text>
    
    <circle cx="25" cy="-40" r="10" fill="#ffa726" stroke="#f57c00" stroke-width="1.5"/>
    <text x="25" y="-36" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">46</text>
    
    <circle cx="50" cy="-40" r="10" fill="#ab47bc" stroke="#7b1fa2" stroke-width="1.5"/>
    <text x="50" y="-36" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">61</text>
    
    <!-- Row 2 -->
    <circle cx="-50" cy="-15" r="10" fill="#ef5350" stroke="#c62828" stroke-width="1.5"/>
    <text x="-50" y="-11" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">14</text>
    
    <circle cx="-25" cy="-15" r="10" fill="#42a5f5" stroke="#1976d2" stroke-width="1.5"/>
    <text x="-25" y="-11" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">23</text>
    
    <circle cx="0" cy="-15" r="10" fill="#66bb6a" stroke="#388e3c" stroke-width="1.5"/>
    <text x="0" y="-11" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">39</text>
    
    <circle cx="25" cy="-15" r="10" fill="#ffa726" stroke="#f57c00" stroke-width="1.5"/>
    <text x="25" y="-11" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">57</text>
    
    <circle cx="50" cy="-15" r="10" fill="#ab47bc" stroke="#7b1fa2" stroke-width="1.5"/>
    <text x="50" y="-11" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">69</text>
    
    <!-- Row 3 with FREE -->
    <circle cx="-50" cy="10" r="10" fill="#ef5350" stroke="#c62828" stroke-width="1.5"/>
    <text x="-50" y="14" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    
    <circle cx="-25" cy="10" r="10" fill="#42a5f5" stroke="#1976d2" stroke-width="1.5"/>
    <text x="-25" y="14" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">30</text>
    
    <!-- FREE with star burst -->
    <circle cx="0" cy="10" r="12" fill="#ffd54f" stroke="#f9a825" stroke-width="2"/>
    <text x="0" y="9" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#d84315" text-anchor="middle">FREE</text>
    <text x="0" y="17" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#d84315" text-anchor="middle">★</text>
    
    <circle cx="25" cy="10" r="10" fill="#ffa726" stroke="#f57c00" stroke-width="1.5"/>
    <text x="25" y="14" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">53</text>
    
    <circle cx="50" cy="10" r="10" fill="#ab47bc" stroke="#7b1fa2" stroke-width="1.5"/>
    <text x="50" y="14" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">75</text>
    
    <!-- Row 4 -->
    <circle cx="-50" cy="35" r="10" fill="#ef5350" stroke="#c62828" stroke-width="1.5"/>
    <text x="-50" y="39" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">10</text>
    
    <circle cx="-25" cy="35" r="10" fill="#42a5f5" stroke="#1976d2" stroke-width="1.5"/>
    <text x="-25" y="39" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">19</text>
    
    <circle cx="0" cy="35" r="10" fill="#66bb6a" stroke="#388e3c" stroke-width="1.5"/>
    <text x="0" y="39" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">44</text>
    
    <circle cx="25" cy="35" r="10" fill="#ffa726" stroke="#f57c00" stroke-width="1.5"/>
    <text x="25" y="39" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">50</text>
    
    <circle cx="50" cy="35" r="10" fill="#ab47bc" stroke="#7b1fa2" stroke-width="1.5"/>
    <text x="50" y="39" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">66</text>
    
    <!-- Row 5 -->
    <circle cx="-50" cy="60" r="10" fill="#ef5350" stroke="#c62828" stroke-width="1.5"/>
    <text x="-50" y="64" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    
    <circle cx="-25" cy="60" r="10" fill="#42a5f5" stroke="#1976d2" stroke-width="1.5"/>
    <text x="-25" y="64" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">17</text>
    
    <circle cx="0" cy="60" r="10" fill="#66bb6a" stroke="#388e3c" stroke-width="1.5"/>
    <text x="0" y="64" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">36</text>
    
    <circle cx="25" cy="60" r="10" fill="#ffa726" stroke="#f57c00" stroke-width="1.5"/>
    <text x="25" y="64" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">48</text>
    
    <circle cx="50" cy="60" r="10" fill="#ab47bc" stroke="#7b1fa2" stroke-width="1.5"/>
    <text x="50" y="64" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">73</text>
    
    <!-- Bottom decoration -->
    <rect x="-68" y="76" width="136" height="12" rx="6" fill="#f5f5f5"/>
    <text x="0" y="85" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#666666" text-anchor="middle">75 BALL BINGO</text>
  </g>
  
  <!-- Main title at top -->
  <text x="250" y="85" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#textShadow)">BINGO</text>
  
  <!-- Subtitle -->
  <text x="250" y="120" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#ffd54f" text-anchor="middle">CLASSIC GAME</text>
  
  <!-- 75 at bottom -->
  <text x="250" y="460" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffd54f" text-anchor="middle" filter="url(#textShadow)">75</text>
</svg>