<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" rx="20" fill="#166534a2"/>
  
  <!-- Bingo Card Grid -->
  <rect x="30" y="40" width="140" height="120" rx="8" fill="#8B4513" opacity="0.95"/>
  
  <!-- Grid Lines -->
  <line x1="58" y1="40" x2="58" y2="160" stroke="#10B981" stroke-width="2"/>
  <line x1="86" y1="40" x2="86" y2="160" stroke="#10B981" stroke-width="2"/>
  <line x1="114" y1="40" x2="114" y2="160" stroke="#10B981" stroke-width="2"/>
  <line x1="142" y1="40" x2="142" y2="160" stroke="#10B981" stroke-width="2"/>
  
  <line x1="30" y1="64" x2="170" y2="64" stroke="#10B981" stroke-width="2"/>
  <line x1="30" y1="88" x2="170" y2="88" stroke="#10B981" stroke-width="2"/>
  <line x1="30" y1="112" x2="170" y2="112" stroke="#10B981" stroke-width="2"/>
  <line x1="30" y1="136" x2="170" y2="136" stroke="#10B981" stroke-width="2"/>
  
  <!-- Marked Numbers (circles) -->
  <circle cx="44" cy="52" r="8" fill="#10B981"/>
  <circle cx="72" cy="76" r="8" fill="#059669"/>
  <circle cx="100" cy="100" r="8" fill="#34D399"/>
  <circle cx="128" cy="124" r="8" fill="#10B981"/>
