<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6D28D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5B21B6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E7FF;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="bingoGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D9F99D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#84CC16;stop-opacity:1" />
    </linearGradient>
    
    <filter id="strongShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-opacity="0.6"/>
    </filter>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGradient)"/>
  
  <!-- Decorative bingo balls -->
  <g opacity="0.25">
    <!-- Top left ball -->
    <circle cx="80" cy="80" r="50" fill="#EC4899"/>
    <text x="80" y="95" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">B</text>
    
    <!-- Top right ball -->
    <circle cx="420" cy="80" r="50" fill="#84CC16"/>
    <text x="420" y="95" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">I</text>
    
    <!-- Bottom left ball -->
    <circle cx="80" cy="420" r="50" fill="#06B6D4"/>
    <text x="80" y="435" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">G</text>
    
    <!-- Bottom right ball -->
    <circle cx="420" cy="420" r="50" fill="#F59E0B"/>
    <text x="420" y="435" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">O</text>
  </g>
  
  <!-- Central circle background -->
  <circle cx="250" cy="250" r="180" fill="#5B21B6" opacity="0.4" filter="url(#strongShadow)"/>
  <circle cx="250" cy="250" r="170" fill="none" stroke="#A3E635" stroke-width="8" opacity="0.6"/>
  <circle cx="250" cy="250" r="155" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.3"/>
  
  <!-- GREAT text - white with shadow -->
  <text x="250" y="200" 
        font-family="Arial, sans-serif" 
        font-size="64" 
        font-weight="900" 
        fill="url(#textGradient)" 
        text-anchor="middle" 
        filter="url(#strongGlow)"
        letter-spacing="4">GREAT</text>
  
  <!-- BINGO text - lime green with strong glow -->
  <text x="250" y="280" 
        font-family="Arial, sans-serif" 
        font-size="80" 
        font-weight="900" 
        fill="url(#bingoGradient)" 
        text-anchor="middle" 
        filter="url(#strongGlow)"
        letter-spacing="6">BINGO</text>
  
  <!-- Subtitle -->
  <text x="250" y="320" 
        font-family="Arial, sans-serif" 
        font-size="18" 
        font-weight="600" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        opacity="0.9"
        letter-spacing="8">PLAY & WIN</text>
  
  <!-- Decorative stars -->
  <g fill="#FCD34D" opacity="0.8">
    <!-- Star 1 -->
    <path d="M 150 130 L 155 145 L 170 145 L 158 154 L 163 169 L 150 160 L 137 169 L 142 154 L 130 145 L 145 145 Z"/>
    <!-- Star 2 -->
    <path d="M 350 130 L 355 145 L 370 145 L 358 154 L 363 169 L 350 160 L 337 169 L 342 154 L 330 145 L 345 145 Z"/>
    <!-- Star 3 -->
    <path d="M 150 370 L 155 385 L 170 385 L 158 394 L 163 409 L 150 400 L 137 409 L 142 394 L 130 385 L 145 385 Z"/>
    <!-- Star 4 -->
    <path d="M 350 370 L 355 385 L 370 385 L 358 394 L 363 409 L 350 400 L 337 409 L 342 394 L 330 385 L 345 385 Z"/>
  </g>
  
  <!-- Outer border frame -->
  <rect x="10" y="10" width="480" height="480" rx="24" fill="none" stroke="#A78BFA" stroke-width="4" opacity="0.5"/>
  <rect x="20" y="20" width="460" height="460" rx="20" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
</svg>